[project]
name = "air-reconciliation"
version = "0.1.0"
description = "Deterministic corporate air payment reconciliation prototype"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
